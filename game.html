<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Pool Snake — guide the snake to break and pot pool balls.">
  <title>POOL SNAKE — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <header class="site-header site-header--scrolled" role="banner">
    <nav class="nav-container" aria-label="Game navigation">
      <a href="index.html" class="nav-logo" aria-label="Back to home">
        <span class="logo-bracket">[</span>POOL SNAKE<span class="logo-bracket">]</span>
      </a>
      <div class="nav-game-score" aria-live="polite">
        SCORE: <span id="nav-score-val">0</span>
      </div>
    </nav>
  </header>

  <main class="game-main">
    <div class="game-wrapper">

      <div class="canvas-wrap">
        <canvas id="game-canvas" aria-label="Pool Snake game board"></canvas>
      </div>

      <div class="score-bar">
        <div class="score-item">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score-val">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">BEST</span>
          <span class="score-value" id="hi-val">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">BALLS</span>
          <span class="score-value score-value--on" id="on-val">-</span>
        </div>
      </div>

      <div class="settings-panel">
        <div class="setting-row">
          <span class="setting-label">BALLS</span>
          <div class="setting-options" role="group" aria-label="Number of balls">
            <button class="setting-btn" data-setting="ballCount" data-value="6">6</button>
            <button class="setting-btn setting-btn--active" data-setting="ballCount" data-value="10">10</button>
            <button class="setting-btn" data-setting="ballCount" data-value="15">15</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">SPEED</span>
          <div class="setting-options" role="group" aria-label="Snake speed">
            <button class="setting-btn" data-setting="speed" data-value="slow">SLOW</button>
            <button class="setting-btn setting-btn--active" data-setting="speed" data-value="normal">NORM</button>
            <button class="setting-btn" data-setting="speed" data-value="fast">FAST</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">POWER</span>
          <div class="setting-options" role="group" aria-label="Ball hit power">
            <button class="setting-btn" data-setting="power" data-value="low">LOW</button>
            <button class="setting-btn setting-btn--active" data-setting="power" data-value="med">MED</button>
            <button class="setting-btn" data-setting="power" data-value="high">HIGH</button>
            <button class="setting-btn" data-setting="power" data-value="max">MAX</button>
          </div>
        </div>
        <div class="setting-row setting-row--bonus">
          <span class="setting-label">BONUS</span>
          <div class="bonus-tiers">
            <label class="bonus-tier">
              <span class="tier-mult">×<input class="tier-input" type="number" data-multiplier="0" value="6" min="1" max="99"></span>
              <span class="tier-sep">≤</span>
              <input class="tier-input tier-input--time" type="number" data-timelimit="0" value="20" min="1" max="999">
              <span class="tier-unit">s</span>
            </label>
            <label class="bonus-tier">
              <span class="tier-mult">×<input class="tier-input" type="number" data-multiplier="1" value="4" min="1" max="99"></span>
              <span class="tier-sep">≤</span>
              <input class="tier-input tier-input--time" type="number" data-timelimit="1" value="50" min="1" max="999">
              <span class="tier-unit">s</span>
            </label>
            <label class="bonus-tier">
              <span class="tier-mult">×<input class="tier-input" type="number" data-multiplier="2" value="2" min="1" max="99"></span>
              <span class="tier-sep">≤</span>
              <input class="tier-input tier-input--time" type="number" data-timelimit="2" value="70" min="1" max="999">
              <span class="tier-unit">s</span>
            </label>
          </div>
        </div>
      </div>

      <div class="game-controls">
        <button class="btn btn--primary" id="action-btn">START GAME</button>
        <button class="btn btn--ghost" id="restart-btn" hidden>RESTART</button>
      </div>

      <div class="dpad" aria-label="Directional controls">
        <button class="dpad-btn dpad-up"    data-dir="up"    aria-label="Move up">&#9650;</button>
        <button class="dpad-btn dpad-left"  data-dir="left"  aria-label="Move left">&#9668;</button>
        <button class="dpad-btn dpad-right" data-dir="right" aria-label="Move right">&#9658;</button>
        <button class="dpad-btn dpad-down"  data-dir="down"  aria-label="Move down">&#9660;</button>
      </div>

      <p class="kb-hint">// ARROWS OR WASD &mdash; SPACE TO START</p>

    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
